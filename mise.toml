# Global mise config, linked to ~/.config/mise/config.toml by install.sh
[tools]
node = "22"
python = "3.13"
# Global CLI tools
"npm:@playwright/cli" = "0.1.22"
"pipx:tox" = "latest"

[settings]
# Also honor .nvmrc / .python-version files in projects
idiomatic_version_file_enable_tools = ["node", "python"]
